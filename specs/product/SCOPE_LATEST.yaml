feature_name: windows-host-network-interface-selection
core_value: >-
  CouchLink advertises a reachable LAN address by default and lets Windows-host
  owners select the address Android remotes use.
summary: >-
  CouchLink Windows Host can advertise an address from a Docker, VPN, or other
  internal adapter. Android remotes cannot reach that address from the home LAN.
  This initiative makes the host prefer a suitable LAN interface by default.

  Windows-host owners can select the advertised network interface when the
  automatic choice is not suitable. The change keeps Android and Windows users
  connected without asking them to understand internal or virtual adapters.
in_scope:
  - id: e01s01
    outcome: >-
      The Windows Host selects a LAN-suitable advertised interface by default
      and avoids Docker, VPN, loopback, and other internal adapters.
  - id: e01s02
    outcome: >-
      The Windows Host lets its owner select the network interface used for
      CouchLink discovery and connection details.
  - id: e01s03
    outcome: >-
      Automated checks prove the default-selection rules and manual-selection
      behavior for representative network-interface inventories.
out_of_scope:
  - item: Persistent interface selection across host restarts.
    reason: >-
      Deferred to keep this initiative limited to choosing and applying an
      interface during the current host session.
  - item: Automatic interface failover after any current-session selected interface becomes unavailable.
    reason: >-
      Deferred because the host must stop advertising stale details and require
      manual reselection; it must not derive a replacement until a new host
      session starts.
  - item: A network diagnostics or adapter-management suite.
    reason: >-
      Deferred because the user need is reachable host discovery, not general
      network administration.
  - item: Docker, VPN, or virtual-network connectivity support.
    reason: >-
      Excluded because those adapters must not become the default advertised
      LAN path.
  - item: Android protocol or UI redesign.
    reason: >-
      Excluded because this initiative changes the Windows Host address choice
      while preserving existing Android connection behavior.
constraints:
  - Do not add dependencies.
  - Preserve local-only operation, pairing, and protocol-v1 compatibility.
  - Preserve the existing UDP discovery and TCP session endpoints.
  - Keep Bluetooth HID independent from the Windows Host.
  - Support the current .NET 8 Windows Host.
success_criteria:
  - Automated checks select a LAN-suitable adapter over representative Docker, VPN, and loopback adapters.
  - Automated checks confirm a user-selected interface becomes the advertised connection address.
  - Relevant Windows Host builds pass with no new dependencies.
references:
  - specs/tech-architecture/tech-stack.md
  - docs/architecture/ARCHITECTURE.md
  - docs/building/TESTING.md
