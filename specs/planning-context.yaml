feature_name: windows-host-network-interface-selection
problem_statement: >-
  CouchLink Windows Host can advertise an unreachable Docker, VPN, or internal
  adapter address. Android remotes on the home LAN cannot connect to that host.
constraints:
  - Do not add dependencies.
  - Preserve .NET 8, protocol-v1, local-only behavior, pairing, UDP 45820, and TCP 45821.
  - Keep Bluetooth HID independent from the Windows Host.
out_of_scope:
  - Persistent interface selection across host restarts.
  - Automatic interface failover.
  - Network diagnostics or adapter-management tooling.
  - Docker, VPN, or virtual-network connectivity support.
  - Android protocol or UI changes.
key_decisions:
  - decision: Default interface priority
    rationale: Prefer an active physical wired Ethernet interface, then Wi-Fi.
  - decision: Manual selector candidates
    rationale: Show eligible physical LAN interfaces only.
  - decision: Selection effect
    rationale: Change advertised discovery and connection details only.
  - decision: Unavailable interface behavior
    rationale: >-
      After any automatic initial or manual current-session selection becomes
      unavailable, stop advertising stale details and require manual
      reselection; do not derive another default until a new host session
      starts.
  - decision: Multiple IPv4 addresses
    rationale: Use the interface primary IPv4 address.
